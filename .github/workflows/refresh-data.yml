name: Refresh player data

# Runs itself every morning through the pre-season so the board is current on draft day
# without anyone having to do anything. Also runnable by hand from the Actions tab.
#
# Nothing is committed unless pipeline/check_data.py passes. A refresh that quietly writes
# a broken file is worse than one that never runs.

on:
  schedule:
    - cron: '15 11 * * *'      # 11:15 UTC daily — early morning US
  workflow_dispatch:            # the "Run workflow" button

permissions:
  contents: write               # needed to commit the refreshed data back

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch from Sleeper
        working-directory: pipeline
        run: python fetch.py

      - name: Rebuild the ratings and export
        working-directory: pipeline
        run: |
          python engine.py
          python export_json.py

      - name: Check the result before trusting it
        run: python pipeline/check_data.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/players.json; then
            echo "No change in the data — nothing to commit."
            exit 0
          fi
          git config user.name  "draft-guide bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/players.json
          git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push

      - name: Summary
        if: always()
        run: |
          echo "### Data refresh" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          try:
              d = json.load(open('data/players.json'))
              print(f"- generated **{d['generated']}**")
              print(f"- {len(d['players'])} players")
              print(f"- {sum(1 for p in d['players'] if p.get('inj'))} carrying an injury flag")
          except Exception as e:
              print(f"- could not read the data file: {e}")
          PY
